services:
  mysql:
    image: mysql:8.4
    container_name: style-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: style
      MYSQL_USER: style_user
      MYSQL_PASSWORD: style_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00

  ollama:
    image: ollama/ollama:latest
    container_name: style-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: style-ollama-pull
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5 && ollama pull qwen2.5:3b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  mysql_data:
  ollama_data:
