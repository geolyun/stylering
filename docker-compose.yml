services:
  mysql:
    image: mysql:8.4
    container_name: style-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: style
      MYSQL_USER: style_user
      MYSQL_PASSWORD: style_pass
      MYSQL_ROOT_PASSWORD: root_pass
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00

volumes:
  mysql_data:
