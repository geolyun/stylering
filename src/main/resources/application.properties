spring.application.name=stylering
spring.datasource.url=jdbc:h2:mem:stylering;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
firebase.project-id=demo-project
prompts.path=docs/prompts
llm.timeout-ms=3000
llm.openai.base-url=https://api.openai.com/v1
llm.openai.model=gpt-4o-mini
chat.rate-limit.per-minute=30
chat.fallback-question=요즘 가장 자주 입는 스타일을 한 가지로 말해줄래요?
